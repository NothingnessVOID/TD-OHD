<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TD-OHD · 虚构测试人物</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 960px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
    h1 { font-size: 1.7rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin: 24px 0; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #8885; white-space: nowrap; }
    button { font: inherit; padding: 10px 18px; cursor: pointer; }
    button:disabled { cursor: wait; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>十位虚构测试人物</h1>
  <p>仅用于本地团队及后续 WA 图开发。这些姓名和出生资料均为虚构，不属于真人，也不是计算精度认证样本。</p>
  <p>当前保存地址：<code id="origin"></code>。仅保存在当前浏览器。固定编号让重复导入自动跳过已存在的人物，不覆盖任何资料。</p>
  <p>十位人物可以加入同一团队。每个 Penta 分组最多 5 人，分析需要 3～5 人，可分成两个五人小组。本页面不会自动创建团队、修改分组或新增 WA 功能。</p>
  <button id="import" type="button" disabled>导入十位虚构测试人物</button>
  <p id="status" role="status" aria-live="polite">正在准备测试资料……</p>
  <p><a href="/">返回 TD-OHD</a> · <a href="/fixtures/dev-test-people.json" download="TD-OHD-fictional-people-10.json">下载 JSON 备份</a></p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>姓名</th><th>出生日期</th><th>当地时间</th><th>地点</th><th>UTC 时差</th></tr></thead>
      <tbody id="people"></tbody>
    </table>
  </div>
  <script type="module">
    import fixture from '../fixtures/dev-test-people.json';
    import { listPeople, savePerson, getLastPersonId, setLastPersonId } from '../src/lib/people.js';
    import { localMode } from '../src/lib/local-store.js';
    import { importTestPeople } from './import-test-people.js';

    const status = document.querySelector('#status');
    const button = document.querySelector('#import');
    document.querySelector('#origin').textContent = location.origin;
    for (const person of fixture.people) {
      const row = document.createElement('tr');
      for (const value of [person.name, person.birthDate, person.birthTime, person.location.name, `UTC${person.timezone >= 0 ? '+' : ''}${person.timezone}`]) {
        const cell = document.createElement('td');
        cell.textContent = value;
        row.append(cell);
      }
      document.querySelector('#people').append(row);
    }

    if (!import.meta.env.DEV || localMode) {
      status.textContent = '仅可在 npm run dev 启动的浏览器本地模式使用。本页面不进入正式构建。';
    } else {
      status.textContent = '已准备好十位人物。点击按钮后才会保存。';
      button.disabled = false;
      button.addEventListener('click', () => {
        button.disabled = true;
        try {
          const wasEmpty = listPeople().length === 0;
          const result = importTestPeople(fixture, { listPeople, savePerson });
          if (wasEmpty && !getLastPersonId()) setLastPersonId(fixture.people[0].id);
          status.textContent = `导入完成：新增 ${result.added} 位，跳过已有 ${result.skipped} 位；人物库共 ${result.total} 位。刷新或重启开发服务后仍会保留。`;
        } catch (error) {
          status.textContent = `导入未完成：${error.message} 如浏览器写入中断，重试会跳过已保存的编号。`;
        } finally {
          button.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
