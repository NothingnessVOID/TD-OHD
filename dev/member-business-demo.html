<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TD-OHD · 成员商业分析（开发演示）</title>
  <link rel="stylesheet" href="/src/styles.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    .demo { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }
    .demo h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
    .demo .notice { margin: 0 0 12px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-sunken); color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
    .demo .notice ul { margin: 6px 0 0; padding-inline-start: 18px; }
    .demo .bar-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; font-size: 13px; }
    .demo .bar-tools select, .demo .bar-tools button { font: inherit; min-height: 32px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-elevated); color: var(--text); }
    .demo .bar-tools button { cursor: pointer; }
    .demo a { color: var(--accent-strong, var(--accent)); }
  </style>
</head>
<body>
  <div class="demo">
    <h1>成员商业分析 · 开发演示</h1>
    <div class="notice" id="demo-note">以下是三位虚构成员的演示，不会改动你的人物、团队或组织资料。图表按各自的虚构出生信息计算，方便比较不同成员的分析结果。
      <ul id="demo-people"></ul>
    </div>
    <div class="bar-tools">
      <button type="button" id="open-business" disabled>打开成员商业分析</button>
      <label>语言 <select id="locale">
        <option value="zh-CN">简体中文</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="en">English</option>
      </select></label>
      <span id="status" role="status" aria-live="polite">正在准备虚构成员…</span>
      <a href="/?view=wa">返回组织页</a>
    </div>
    <section id="wa-view" class="view-section"></section>
  </div>
  <script type="module" src="/dev/member-business-demo.js"></script>
</body>
</html>
