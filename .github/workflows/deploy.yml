name: Deploy to GitHub Pages

# Publish only from the dedicated pages branch. Work on main does not change
# the live site until it is deliberately promoted to pages.
# The build is static and omits account/sync API configuration.

on:
  push:
    branches: [pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        # Pages has no account/sync API; omit .env.production's same-origin API setting.
        run: npm run build:pages

      - name: Check static bundle
        run: npm run check:pages-bundle

      - name: Install Chromium for browser checks
        run: npx playwright-core install --with-deps chromium

      - name: Start browser test server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/pages-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pages-vite.log
          exit 1

      - name: Check timeline, planetary detail, and reference in browser
        env:
          E2E_URL: http://127.0.0.1:5173
          CHROME_CHANNEL: chromium
          SKIP_TIMELINE_YEAR: "1"
        run: |
          npm run e2e:timeline
          npm run e2e:planet
          npm run e2e:reference

      - name: Show browser test server log on failure
        if: failure()
        run: cat /tmp/pages-vite.log || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
