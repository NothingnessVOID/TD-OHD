name: Deploy to GitHub Pages

# Publish the live site automatically from main.
# Every push to main rebuilds and, only if the full test and build job
# passes, deploys the static bundle. The build is static and omits
# account/sync API configuration.
# workflow_dispatch allows a deliberate re-run without a new commit.
# Nothing here deploys from, or cancels, an in-progress official deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep a single Pages pipeline. cancel-in-progress is false so a newer push
# never cancels a deployment that is already publishing the live site; the
# queued run waits its turn instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Build only the source of the current main. On push this is the pushed
      # commit; on a manual dispatch this pins to main regardless of the branch
      # the run was started from.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Prepare pinned Sharp runtime and Swiss files for native tests
        run: npm run build:engine

      # Build the static Pages bundle first: the release/distribution tests
      # inspect dist/, so it must exist before the suite runs.
      - name: Build
        # Pages has no account/sync API; omit .env.production's same-origin API setting.
        run: npm run build:pages

      - name: Run tests
        run: npm test

      - name: Check static bundle
        run: npm run check:pages-bundle

      - name: Install Chromium for browser checks
        run: npx playwright-core install --with-deps chromium

      - name: Start browser test server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/pages-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pages-vite.log
          exit 1

      - name: Check timeline, planetary detail, and reference in browser
        env:
          E2E_URL: http://127.0.0.1:5173
          CHROME_CHANNEL: chromium
          SKIP_TIMELINE_YEAR: "1"
        run: |
          npm run e2e:timeline
          npm run e2e:planet
          npm run e2e:reference

      - name: Show browser test server log on failure
        if: failure()
        run: cat /tmp/pages-vite.log || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
