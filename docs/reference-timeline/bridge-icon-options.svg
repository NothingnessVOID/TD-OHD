<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">本命定义岛桥接图标方案</title>
  <desc id="desc">A 合并，B 闭合，C 连结。每种展示放大图标和时间轴中的实际尺寸。</desc>
  <defs>
    <symbol id="merge" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4.5" cy="6.5" r="2"/><circle cx="4.5" cy="17.5" r="2"/>
        <path d="M7 6.5h3c3.5 0 4 5.5 7 5.5M7 17.5h3c3.5 0 4-5.5 7-5.5"/>
        <circle cx="19" cy="12" r="3" fill="currentColor" stroke="none"/>
      </g>
    </symbol>
    <symbol id="complete" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="m7.4 12.1 3.1 3.2 6.3-6.7"/>
      </g>
    </symbol>
    <symbol id="connected" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7 7 10 10M17 7 7 17"/>
        <circle cx="5" cy="5" r="2.5" fill="#161a1b"/><circle cx="19" cy="5" r="2.5" fill="#161a1b"/>
        <circle cx="5" cy="19" r="2.5" fill="#161a1b"/><circle cx="19" cy="19" r="2.5" fill="#161a1b"/>
      </g>
    </symbol>
  </defs>
  <rect width="900" height="350" rx="18" fill="#f7f5f1"/>
  <text x="28" y="42" font-size="24" font-family="sans-serif" fill="#242629">桥接首行图标，实际尺寸 22 × 22</text>
  <g font-family="sans-serif">
    <g transform="translate(28 68)">
      <rect width="264" height="250" rx="14" fill="#ffffff" stroke="#dedbd4"/>
      <text x="18" y="34" font-size="18" font-weight="700" fill="#222">A · 合并</text>
      <text x="18" y="57" font-size="12" fill="#697174">多个岛汇合为一个</text>
      <use href="#merge" x="82" y="75" width="100" height="100" color="#078e97"/>
      <rect x="18" y="195" width="228" height="37" fill="#222424" rx="5"/>
      <use href="#merge" x="26" y="203" width="22" height="22" color="#33b1b7"/>
      <text x="59" y="220" font-size="13" fill="#f2f1ed">2 分 → 1 分</text>
    </g>
    <g transform="translate(318 68)">
      <rect width="264" height="250" rx="14" fill="#ffffff" stroke="#dedbd4"/>
      <text x="18" y="34" font-size="18" font-weight="700" fill="#222">B · 闭合</text>
      <text x="18" y="57" font-size="12" fill="#697174">强调桥接已经完成</text>
      <use href="#complete" x="82" y="75" width="100" height="100" color="#078e97"/>
      <rect x="18" y="195" width="228" height="37" fill="#222424" rx="5"/>
      <use href="#complete" x="26" y="203" width="22" height="22" color="#33b1b7"/>
      <text x="59" y="220" font-size="13" fill="#f2f1ed">2 分 → 1 分</text>
    </g>
    <g transform="translate(608 68)">
      <rect width="264" height="250" rx="14" fill="#ffffff" stroke="#dedbd4"/>
      <text x="18" y="34" font-size="18" font-weight="700" fill="#222">C · 连结</text>
      <text x="18" y="57" font-size="12" fill="#697174">多个岛形成连接</text>
      <use href="#connected" x="82" y="75" width="100" height="100" color="#078e97"/>
      <rect x="18" y="195" width="228" height="37" fill="#222424" rx="5"/>
      <use href="#connected" x="26" y="203" width="22" height="22" color="#33b1b7"/>
      <text x="59" y="220" font-size="13" fill="#f2f1ed">2 分 → 1 分</text>
    </g>
  </g>
</svg>
